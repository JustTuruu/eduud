name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend:
    name: Backend unit test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend-spring
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven
      # Unit test нь Postgres/Kafka шаардахгүй
      - name: Test
        run: mvn -B test
      - name: Surefire тайлан хадгалах
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports
          path: backend-spring/target/surefire-reports

  app:
    name: Flutter test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter test
