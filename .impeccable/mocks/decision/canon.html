<!doctype html>
<html lang="mn">
<head>
<meta charset="utf-8">
<title>E-Duud — Canon</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&subset=cyrillic&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:390px;height:844px;overflow:hidden;background:#fff;color:#111827;font-family:"Inter",system-ui,sans-serif}
.app{position:relative;width:390px;height:844px;overflow:hidden;background:#fff}
.status{height:44px;display:flex;justify-content:space-between;align-items:center;padding:6px 28px 0;font-size:15px;font-weight:600}
.status .r{display:flex;gap:6px;align-items:center}
.header{display:flex;justify-content:space-between;align-items:center;padding:10px 20px 14px}
.logo{font-size:22px;font-weight:800;letter-spacing:-.02em}
.logo b{color:#2563EB}
.chip{display:flex;align-items:center;gap:6px;background:#EFF6FF;color:#1D4ED8;font-weight:600;font-size:13px;padding:7px 12px;border-radius:999px}
.chip i{width:10px;height:10px;border-radius:50%;background:#2563EB;display:block}
.card{margin:0 20px;border-radius:24px;border:1px solid #E5E7EB;box-shadow:0 8px 24px rgba(17,24,39,.08);overflow:hidden;background:#fff}
.img{position:relative;height:200px;background:radial-gradient(circle at 70% 25%,#93C5FD 0,transparent 45%),linear-gradient(135deg,#DBEAFE,#BFDBFE 50%,#E0E7FF)}
.phone{position:absolute;left:50%;top:22px;width:92px;height:164px;margin-left:-46px;border-radius:20px;background:linear-gradient(160deg,#374151,#111827);box-shadow:0 18px 30px rgba(17,24,39,.3);transform:rotate(-6deg)}
.phone:after{content:"";position:absolute;inset:6px;border-radius:15px;background:linear-gradient(160deg,#60A5FA,#1E3A8A)}
.badge{position:absolute;left:14px;top:14px;display:flex;align-items:center;gap:6px;background:#fff;color:#111827;font-size:12px;font-weight:700;padding:5px 10px;border-radius:999px}
.badge i{width:7px;height:7px;border-radius:50%;background:#EF4444}
.body{padding:16px 18px 18px}
.title{font-size:19px;font-weight:700;letter-spacing:-.01em}
.row{display:flex;justify-content:space-between;align-items:flex-end;margin-top:12px}
.lbl{font-size:12px;color:#6B7280;font-weight:500}
.price{font-size:30px;font-weight:800;letter-spacing:-.02em;margin-top:2px}
.time{text-align:right}
.time .price{color:#2563EB;font-variant-numeric:tabular-nums}
.leader{margin-top:12px;font-size:13px;color:#6B7280}
.leader b{color:#111827;font-weight:600}
.btn{margin-top:14px;height:50px;border-radius:14px;background:#2563EB;color:#fff;font-weight:700;font-size:16px;display:flex;align-items:center;justify-content:center;box-shadow:0 6px 14px rgba(37,99,235,.3)}
h2{font-size:17px;font-weight:700;padding:22px 20px 12px}
.scroll{display:flex;gap:12px;padding-left:20px;overflow:hidden}
.mini{flex:none;width:150px}
.mini .t{height:96px;border-radius:16px}
.mini p{font-size:14px;font-weight:600;margin-top:8px}
.mini span{font-size:12px;color:#6B7280}
.tabs{position:absolute;left:20px;right:20px;bottom:26px;height:64px;border-radius:24px;background:rgba(255,255,255,.72);backdrop-filter:blur(20px) saturate(180%);-webkit-backdrop-filter:blur(20px) saturate(180%);border:1px solid rgba(229,231,235,.9);box-shadow:0 10px 30px rgba(17,24,39,.12);display:flex;justify-content:space-around;align-items:center}
.tab{display:flex;flex-direction:column;align-items:center;gap:3px;font-size:11px;font-weight:600;color:#6B7280;width:90px}
.tab svg{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.tab.on{color:#2563EB}
</style>
</head>
<body>
<div class="app">
  <div class="status"><span>9:41</span><span class="r"><svg width="18" height="12" viewBox="0 0 18 12" fill="#111827"><rect x="0" y="8" width="3" height="4" rx="1"/><rect x="5" y="5" width="3" height="7" rx="1"/><rect x="10" y="2" width="3" height="10" rx="1"/><rect x="15" y="0" width="3" height="12" rx="1"/></svg><svg width="26" height="12" viewBox="0 0 26 12"><rect x=".5" y=".5" width="22" height="11" rx="3.5" fill="none" stroke="#111827" opacity=".5"/><rect x="2" y="2" width="17" height="8" rx="2" fill="#111827"/></svg></span></div>
  <div class="header"><div class="logo">E-<b>Duud</b></div><div class="chip"><i></i>128 токен</div></div>

  <div class="card">
    <div class="img"><div class="phone"></div><div class="badge"><i></i>Шууд</div></div>
    <div class="body">
      <div class="title">iPhone 16 Pro 256GB</div>
      <div class="row">
        <div><div class="lbl">Одоогийн үнэ</div><div class="price">12 430₮</div></div>
        <div class="time"><div class="lbl">Үлдсэн хугацаа</div><div class="price">00:07</div></div>
      </div>
      <div class="leader">Тэргүүлэгч: <b>Бат-Эрдэнэ</b></div>
      <div class="btn">Санал өгөх</div>
    </div>
  </div>

  <h2>Удахгүй эхлэх</h2>
  <div class="scroll">
    <div class="mini"><div class="t" style="background:linear-gradient(135deg,#E0E7FF,#A5B4FC)"></div><p>PlayStation 5 Slim</p><span>Маргааш 20:00</span></div>
    <div class="mini"><div class="t" style="background:linear-gradient(135deg,#FCE7F3,#F9A8D4)"></div><p>Dyson Airwrap</p><span>Маргааш 20:00</span></div>
    <div class="mini"><div class="t" style="background:linear-gradient(135deg,#DCFCE7,#86EFAC)"></div><p>AirPods Pro 2</p><span>Маргааш 20:00</span></div>
  </div>

  <nav class="tabs">
    <div class="tab on"><svg viewBox="0 0 24 24"><path d="M3 11l9-8 9 8v9a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/></svg>Нүүр</div>
    <div class="tab"><svg viewBox="0 0 24 24"><path d="M14 4l6 6-3 3-6-6zM11 7l-7 7 3 3 7-7M4 21h10"/></svg>Хүсэлт</div>
    <div class="tab"><svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 3.6-7 8-7s8 3 8 7"/></svg>Профайл</div>
  </nav>
</div>
</body>
</html>
