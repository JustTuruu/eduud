<style>

.stack{position:absolute;left:16px;right:16px;bottom:16px;display:flex;flex-direction:column;gap:8px}
.tags{display:flex;align-items:center;gap:8px;font-size:11px;font-weight:700;letter-spacing:.08em;color:#fff}
.dot{width:8px;height:8px;border-radius:50%;background:var(--red)}
.tag{padding:2px 8px;border:1px solid rgba(255,255,255,.5)}
.title{background:#fff;height:32px;padding:0 12px;display:flex;align-items:center;font-weight:700;font-size:15px}
.plates{display:flex;gap:8px}
.price{flex:1;background:var(--y);height:72px;padding:0 12px;display:flex;align-items:center;font-size:52px;line-height:1}
.clock{width:128px;background:var(--ink);color:#fff;height:72px;display:flex;flex-direction:column;justify-content:center;padding:0 12px;gap:8px}

.bar{height:3px;background:rgba(255,255,255,.2)}.bar s{display:block;width:23%;height:100%;background:#ff6b5e}
.lead{background:rgba(11,15,31,.72);border-left:3px solid var(--y);padding:6px 12px;font-size:12px;color:#fff}

.cta{position:absolute;left:16px;right:16px;top:516px;height:56px;background:var(--ink);color:var(--y);display:flex;align-items:center;justify-content:center;gap:8px;font-weight:700;font-size:16px;border-radius:2px;box-shadow:0 0 0 4px rgba(255,255,255,.16)}
.sec{position:absolute;left:0;right:0;top:596px;background:var(--cb)}
.sh{display:flex;justify-content:space-between;align-items:baseline;padding:0 16px;color:#fff;margin-bottom:12px}
.sh h2{font-size:17px;font-weight:700}.sh a{font-size:13px;color:#fff;opacity:.75}
.row{display:flex;gap:12px;padding-left:16px;width:390px;overflow:hidden}
.card{flex:none;width:136px;background:#fff;border:1px solid rgba(11,15,31,.12)}
.im{height:64px;background:linear-gradient(135deg,#dfe4fb,#aab6f0);position:relative}
.im:after{content:"";position:absolute;left:50%;top:50%;width:28px;height:28px;margin:-14px;border-radius:8px;background:rgba(11,15,31,.55)}
.cb{padding:8px;display:flex;flex-direction:column;gap:2px}
.cb small{font-size:10px;font-weight:700;letter-spacing:.08em;opacity:.55}
.cb strong{font-size:13px;font-weight:600;line-height:1.2;height:32px}
.cb em{font-style:normal;align-self:flex-start;background:var(--y);font-size:11px;font-weight:700;padding:2px 6px}
.end{position:absolute;left:16px;top:772px;color:#fff;font-size:17px;font-weight:700;opacity:.9}
.tabs{position:absolute;left:24px;right:24px;bottom:24px;height:64px;border-radius:28px;background:rgba(255,255,255,.18);backdrop-filter:blur(24px) saturate(1.6);-webkit-backdrop-filter:blur(24px) saturate(1.6);border:1px solid rgba(255,255,255,.35);display:flex;align-items:center;padding:0 8px;gap:4px;box-shadow:0 8px 24px rgba(5,10,60,.35);z-index:9}
.tab{flex:1;height:48px;border-radius:22px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;color:#fff;font-size:11px;font-weight:600}
.tab.on{background:#fff;color:var(--cb)}
svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.on svg{fill:currentColor}
