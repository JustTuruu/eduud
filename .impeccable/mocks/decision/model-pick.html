<!doctype html>
<html lang="mn"><head><meta charset="utf-8"><title>E-Duud Now Playing</title>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;700;800&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:390px;height:844px;overflow:hidden;background:#2A1B3D}
body{position:relative;font-family:'Manrope',sans-serif;font-weight:500;color:#E9D8C4}
.field{position:absolute;inset:0;background:
radial-gradient(420px 380px at 50% 34%,rgba(255,107,74,.85),transparent 70%),
radial-gradient(300px 300px at 95% 70%,rgba(255,107,74,.35),transparent 70%),
radial-gradient(360px 300px at 0% 100%,rgba(120,60,140,.6),transparent 70%),
linear-gradient(180deg,#3a2352 0%,#2A1B3D 55%,#1d1229 100%);filter:blur(10px)}
.grain{position:absolute;inset:0;background:linear-gradient(180deg,rgba(20,10,30,.15),rgba(20,10,30,.55) 62%,rgba(20,10,30,.8))}
.screen{position:absolute;inset:0;padding:54px 24px 0}
.top{display:flex;justify-content:space-between;align-items:center;height:36px}
.top h1{font-size:22px;font-weight:800;letter-spacing:-.02em;color:#fff}
.chip{display:flex;align-items:center;gap:7px;padding:7px 13px;border-radius:99px;background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.18);font-weight:700;font-size:13px;color:#fff;backdrop-filter:blur(12px)}
.chip i{width:10px;height:10px;border-radius:50%;background:#FF6B4A;box-shadow:0 0 8px #FF6B4A}
.art{margin:16px auto 0;width:288px;height:288px;border-radius:30px;position:relative;overflow:hidden;
background:linear-gradient(145deg,#ffb08a 0%,#FF6B4A 45%,#8a2e4f 100%);
box-shadow:0 30px 60px -12px rgba(20,5,25,.65),0 8px 20px rgba(255,107,74,.3),inset 0 1px 0 rgba(255,255,255,.4)}
.phone{position:absolute;left:84px;top:34px;width:120px;height:230px;border-radius:26px;
background:linear-gradient(160deg,#4b4358,#1c1724 60%,#3a3347);box-shadow:0 14px 30px rgba(0,0,0,.45),inset 0 0 0 2px rgba(255,255,255,.18);transform:rotate(-6deg)}
.phone:before{content:"";position:absolute;left:8px;top:8px;right:8px;bottom:8px;border-radius:19px;background:linear-gradient(150deg,#e9d8c4 0%,#ff9a7a 55%,#6a2c70)}
.phone:after{content:"";position:absolute;left:41px;top:14px;width:38px;height:11px;border-radius:9px;background:#111}
.cam{position:absolute;right:18px;top:48px;width:38px;height:38px;border-radius:12px;background:rgba(30,22,40,.75);transform:rotate(-6deg);box-shadow:inset 0 0 0 1.5px rgba(255,255,255,.25)}
.cam:before,.cam:after{content:"";position:absolute;width:11px;height:11px;border-radius:50%;background:#0b0810;box-shadow:0 0 0 2px #5c5468}
.cam:before{left:5px;top:5px}.cam:after{right:5px;bottom:5px}
.badge{position:absolute;left:14px;top:14px;padding:5px 10px;border-radius:99px;background:rgba(20,10,30,.55);font-size:11px;font-weight:700;color:#fff;letter-spacing:.04em}
.badge:before{content:"";display:inline-block;width:6px;height:6px;border-radius:50%;background:#FF6B4A;margin-right:6px}
.meta{margin-top:18px;padding:0 6px}
.meta h2{font-size:22px;font-weight:800;color:#fff;letter-spacing:-.02em}
.meta p{font-size:14px;margin-top:3px;opacity:.78}
.price{display:flex;align-items:baseline;justify-content:space-between;margin-top:8px}
.price b{font-size:42px;font-weight:800;color:#fff;letter-spacing:-.03em;font-variant-numeric:tabular-nums}
.bar{height:5px;border-radius:9px;background:rgba(255,255,255,.2);margin-top:6px;overflow:hidden}
.bar span{display:block;width:14%;height:100%;border-radius:9px;background:linear-gradient(90deg,#FF6B4A,#ffb08a);box-shadow:0 0 12px #FF6B4A}
.times{display:flex;justify-content:space-between;font-size:12px;font-weight:700;margin-top:7px;font-variant-numeric:tabular-nums}
.times b{color:#FF9A7A}
.cta{display:block;width:100%;margin-top:14px;height:56px;border:0;border-radius:99px;font:800 17px 'Manrope',sans-serif;color:#2A1B3D;background:linear-gradient(180deg,#fff,#E9D8C4);box-shadow:0 12px 28px -6px rgba(255,107,74,.7),inset 0 -2px 0 rgba(0,0,0,.08)}
.sec{margin-top:18px;font-size:15px;font-weight:800;color:#fff;padding:0 6px}
.row{display:flex;gap:12px;margin:10px -24px 0;padding:0 24px;overflow:hidden}
.card{flex:none;width:92px}
.card div{width:92px;height:92px;border-radius:18px;box-shadow:0 8px 18px rgba(10,0,20,.4),inset 0 1px 0 rgba(255,255,255,.25)}
.card h3{font-size:12px;font-weight:700;color:#fff;margin-top:7px;white-space:nowrap}
.card p{font-size:11px;opacity:.65;margin-top:1px}
.tabs{position:absolute;left:24px;right:24px;bottom:26px;height:64px;border-radius:99px;display:flex;align-items:center;justify-content:space-around;padding:0 8px;
background:rgba(40,24,58,.45);backdrop-filter:blur(24px) saturate(1.6);-webkit-backdrop-filter:blur(24px) saturate(1.6);border:1px solid rgba(255,255,255,.18);box-shadow:0 14px 34px rgba(10,0,20,.5),inset 0 1px 0 rgba(255,255,255,.2)}
.tab{display:flex;flex-direction:column;align-items:center;gap:3px;font-size:10.5px;font-weight:700;opacity:.6;width:92px;height:50px;justify-content:center;border-radius:99px}
.tab.on{opacity:1;color:#fff;background:rgba(255,255,255,.16)}
.tab.on svg{stroke:#FF8A6B}
svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
</style></head><body>
<div class="field"></div><div class="grain"></div>
<div class="screen">
 <div class="top"><h1>Нүүр</h1><div class="chip"><i></i>128 токен</div></div>
 <div class="art"><div class="phone"></div><div class="cam"></div><div class="badge">ШУУД</div></div>
 <div class="meta"><h2>iPhone 16 Pro 256GB</h2><p>Тэргүүлж буй: Бат-Эрдэнэ</p>
  <div class="price"><b>12 430₮</b></div>
  <div class="bar"><span></span></div>
  <div class="times"><b>00:07</b><span>214 санал</span></div></div>
 <button class="cta">Санал өгөх</button>
 <div class="sec">Удахгүй эхлэх</div>
 <div class="row">
  <div class="card"><div style="background:linear-gradient(135deg,#6b8cff,#1b2a6b)"></div><h3>PlayStation 5 Slim</h3><p>Маргааш 20:00</p></div>
  <div class="card"><div style="background:linear-gradient(135deg,#f7c6e0,#a8458f)"></div><h3>Dyson Airwrap</h3><p>Маргааш 20:00</p></div>
  <div class="card"><div style="background:linear-gradient(135deg,#f1ead9,#8c8a9c)"></div><h3>AirPods Pro 2</h3><p>Маргааш 20:00</p></div>
  <div class="card"><div style="background:#ffffff22"></div></div>
 </div>
</div>
<nav class="tabs">
 <div class="tab on"><svg viewBox="0 0 24 24"><path d="M4 11l8-7 8 7v8a1 1 0 0 1-1 1h-4v-6h-6v6H5a1 1 0 0 1-1-1z"/></svg>Нүүр</div>
 <div class="tab"><svg viewBox="0 0 24 24"><path d="M12 3l2.6 5.6 6 .8-4.4 4.1 1.1 6L12 16.7 6.7 19.5l1.1-6L3.4 9.4l6-.8z"/></svg>Хүсэлт</div>
 <div class="tab"><svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 20c1-4 4-6 8-6s7 2 8 6"/></svg>Профайл</div>
</nav>
</body></html>
