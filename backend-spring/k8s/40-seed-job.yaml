# Багц, админ (99000000 / admin1234), контент seed. Давтан ажиллуулахад аюулгүй.
#   kubectl -n eduud delete job seed --ignore-not-found && kubectl apply -f k8s/40-seed-job.yaml
apiVersion: batch/v1
kind: Job
metadata:
  name: seed
  namespace: eduud
spec:
  backoffLimit: 6
  ttlSecondsAfterFinished: 600
  template:
    spec:
      enableServiceLinks: false
      restartPolicy: OnFailure
      initContainers:
        - name: wait-backend
          image: busybox:1.36
          # Backend асаахдаа Flyway migration хийнэ — хүснэгтүүд үүссэний дараа seed хийнэ
          command: ["sh", "-c", "until wget -qO- http://backend:3000/actuator/health; do sleep 3; done"]
      containers:
        - name: seed
          image: eduud-backend:local
          imagePullPolicy: Never
          args: ["--seed"]
          envFrom:
            - configMapRef:
                name: backend-config
            - secretRef:
                name: backend-secrets
